name: commit-policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Commit policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --depth=0 origin "$PR_BASE" || true
            echo "range=${PR_BASE}..${PR_HEAD}" >> "$GITHUB_OUTPUT"
          elif [ -n "${BEFORE:-}" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "range=${BEFORE}..${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            # New branch, force-push, or unavailable base: check the whole history.
            echo "range=" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce commit policy
        run: ./scripts/check-commits.sh ${{ steps.range.outputs.range }}

      - name: Verify hooks and ignore rules are intact
        run: |
          set -euo pipefail
          for f in .githooks/commit-msg .githooks/pre-commit .githooks/pre-push .gitignore scripts/check-commits.sh; do
            test -f "$f" || { echo "missing required file: $f"; exit 1; }
          done
          test -x .githooks/commit-msg  || { echo ".githooks/commit-msg is not executable"; exit 1; }
          test -x .githooks/pre-commit  || { echo ".githooks/pre-commit is not executable"; exit 1; }
          test -x .githooks/pre-push    || { echo ".githooks/pre-push is not executable"; exit 1; }
          grep -qxF 'CLAUDE.md' .gitignore || { echo ".gitignore no longer ignores CLAUDE.md"; exit 1; }
          grep -qxF '.claude/'  .gitignore || { echo ".gitignore no longer ignores .claude/"; exit 1; }
          echo "guards intact"
