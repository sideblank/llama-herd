name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned. A floating ref means an upstream commit can break the build with no change
  # here, and two builds of the same tag can differ. Bump deliberately, and note the new
  # ref in the release notes: users match a GGUF to the upstream a binary was built on.
  LLAMA_CPP_REF: b10545

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # No macOS here. It bills at 10x the minute rate, and on a private repo a
      # handful of runs consumes the whole monthly allowance — 180 macOS minutes
      # cost 1,800 of 2,000 included minutes and blocked every other workflow.
      # macOS still builds in the release workflow, which runs only on tags, so
      # darwin binaries still ship without paying that rate on every change.
      #
      # Windows bills at 2x, so it runs on pull requests and on demand rather than
      # on every push. The matrix is chosen by event here, in the strategy, because
      # a job-level `if` cannot see the matrix: it is evaluated before the matrix
      # exists, and a workflow that references it fails at startup with no jobs and
      # no log — which is how this workflow failed on every push since it was written.
      matrix: >-
        ${{ fromJSON(github.event_name == 'push'
            && '{"include":[{"name":"linux-amd64","os":"ubuntu-latest"}]}'
            || '{"include":[{"name":"linux-amd64","os":"ubuntu-latest"},{"name":"windows-amd64","os":"windows-latest"}]}') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          # No third-party dependencies yet, so there is no go.sum to key a cache on.
          cache: false

      - name: Build llama.cpp
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$LLAMA_CPP_REF" \
            https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/prefix"
          cmake --build "$RUNNER_TEMP/build" --config Release -j "$(nproc)"
          cmake --install "$RUNNER_TEMP/build" --config Release

      - name: Build the speculative shim
        shell: bash
        # The binding links liblhspec, the C ABI over llama.cpp's speculative code. The
        # real shim needs the common library (LLAMA_BUILD_COMMON=ON), which the image
        # builds; this workflow verifies that the binding compiles and its tests pass,
        # not that speculation runs, so it builds the stub — same ABI, reports no
        # speculation — against the same headers. Without any shim the link fails on
        # -llhspec, which is not a finding about the code.
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) out="$RUNNER_TEMP/prefix/lib/liblhspec.dll" ;;
            *)       out="$RUNNER_TEMP/prefix/lib/liblhspec.so" ;;
          esac
          mkdir -p "$RUNNER_TEMP/prefix/lib" "$RUNNER_TEMP/prefix/include"
          g++ -O2 -fPIC -shared -std=c++17 \
            -I"$RUNNER_TEMP/prefix/include" -Ishim \
            shim/lhspec_stub.cpp -o "$out"
          cp shim/lhspec.h "$RUNNER_TEMP/prefix/include/"

      - name: Vet and build
        shell: bash
        run: |
          set -euo pipefail
          export CGO_CFLAGS="-I$RUNNER_TEMP/prefix/include"
          export CGO_LDFLAGS="-L$RUNNER_TEMP/prefix/lib"
          # -L tells the linker where to look; it does not tell the loader. The binding
          # package now has tests, so a test binary is linked and RUN, and without this it
          # fails at startup on a missing libllama.so rather than on anything it asserts.
          export LD_LIBRARY_PATH="$RUNNER_TEMP/prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export DYLD_LIBRARY_PATH="$RUNNER_TEMP/prefix/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          gofmt -l . | tee /tmp/unformatted
          test ! -s /tmp/unformatted || { echo "gofmt found unformatted files"; exit 1; }
          go vet ./...
          go build ./...
          # The scheduler is backend-agnostic on purpose, so its tests run on every
          # platform with no GPU and no model present. The binding package's tests cover
          # capacity arithmetic only — they need the library present to link, not a GPU.
          go test ./... -race -count=1
          # Constants this package writes as literals — so it can build against llama.cpp
          # revisions that predate them — checked against the header that does define them.
          # Skipped by a default build precisely because an older header would not compile it.
          go test -tags llamaabi ./internal/llama/ -count=1
