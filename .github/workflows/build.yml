name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned. A floating ref means an upstream commit can break the build with no change
  # here, and two builds of the same tag can differ. Bump deliberately, and note the new
  # ref in the release notes: users match a GGUF to the upstream a binary was built on.
  LLAMA_CPP_REF: b10545

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runs on every change. macOS and Windows bill at 10x and 2x minutes
          # respectively, so on a private repo they are gated to pull requests and manual
          # runs rather than every push — a full matrix on every commit exhausts a month
          # of included minutes in a couple of days.
          - {name: linux-amd64,   os: ubuntu-latest,  always: true}
          - {name: macos-arm64,   os: macos-14,       always: false}
          - {name: windows-amd64, os: windows-latest, always: false}
    if: >-
      matrix.always ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          # No third-party dependencies yet, so there is no go.sum to key a cache on.
          cache: false

      - name: Build llama.cpp
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$LLAMA_CPP_REF" \
            https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/prefix"
          cmake --build "$RUNNER_TEMP/build" --config Release -j
          cmake --install "$RUNNER_TEMP/build" --config Release

      - name: Vet and build
        shell: bash
        run: |
          set -euo pipefail
          export CGO_CFLAGS="-I$RUNNER_TEMP/prefix/include"
          export CGO_LDFLAGS="-L$RUNNER_TEMP/prefix/lib"
          gofmt -l . | tee /tmp/unformatted
          test ! -s /tmp/unformatted || { echo "gofmt found unformatted files"; exit 1; }
          go vet ./...
          go build ./...
          # The scheduler is backend-agnostic on purpose, so its tests run on every
          # platform with no GPU and no model present.
          go test ./... -race -count=1
