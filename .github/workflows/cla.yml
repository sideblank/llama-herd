name: cla

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  check:
    name: CLA signed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Verify the author has signed
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          # The agreement is not in force until the receiving entity exists and counsel has
          # reviewed it. Until then this job reports and passes rather than blocking contributors
          # on a document they cannot validly sign.
          if grep -q 'NOT YET IN FORCE' .github/CLA.md; then
            echo "::notice::The CLA is still a draft and is not in force. Skipping the signature check."
            echo "Resolve the placeholders in .github/CLA.md to activate this gate."
            exit 0
          fi

          if [ ! -f CLA-SIGNATURES.md ]; then
            echo "::error::CLA-SIGNATURES.md is missing."; exit 1
          fi

          # Match the username only in the first table column, so a name or note cannot spoof it.
          if awk -F'|' '/^\|/ {gsub(/[[:space:]]/,"",$2); print $2}' CLA-SIGNATURES.md \
               | grep -qxiF "$AUTHOR"; then
            echo "CLA: @$AUTHOR has signed."
            exit 0
          fi

          cat >&2 <<MSG
          ::error::@$AUTHOR has not signed the Contributor Licence Agreement.

          Read .github/CLA.md, then add a row for yourself to CLA-SIGNATURES.md in this pull
          request and confirm in the description that you agree to it.
          MSG
          exit 1
