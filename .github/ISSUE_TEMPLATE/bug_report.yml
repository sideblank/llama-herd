name: Bug report
description: Something behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For security problems, do **not** open an issue — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Exact commands, manifest, and request that trigger it.
      render: shell
    validations: {required: true}
  - type: input
    id: gpu
    attributes:
      label: GPU
      placeholder: "RTX 4090 24GB, driver 555.42, CUDA 12.5"
    validations: {required: true}
  - type: textarea
    id: model
    attributes:
      label: Model and manifest
      description: Which model, which quantization, and the stream/context settings in use.
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations: {required: true}
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
